<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TicketAM – Painel Admin</title>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="admin.css" />
</head>
<body>

  <!-- LOGIN -->
  <div id="tela-login">
    <div class="login-card">
      <div class="login-logo">Ticket<span>AM</span></div>
      <p class="login-sub">Painel de administração</p>
      <div class="campo">
        <label>E-mail</label>
        <input type="email" id="login-email" placeholder="admin@ticketam.com.br" />
      </div>
      <div class="campo">
        <label>Senha</label>
        <input type="password" id="login-senha" placeholder="••••••••" />
      </div>
      <button class="btn-login" onclick="login()">Entrar</button>
      <div class="login-erro" id="login-erro"></div>
    </div>
  </div>

  <!-- PAINEL ADMIN -->
  <div id="tela-admin">
    <nav class="admin-nav">
      <div class="admin-logo">Ticket<span>AM</span> <small>Admin</small></div>
      <div class="admin-user">
        <span id="admin-email"></span>
        <button class="btn-logout" onclick="logout()">Sair</button>
      </div>
    </nav>

    <div class="admin-body">
      <div class="admin-header">
        <h1>Eventos</h1>
        <button class="btn-novo" onclick="abrirFormulario()">+ Novo evento</button>
      </div>
      <div id="lista-eventos"><p style="color:var(--cinza-texto)">Carregando…</p></div>
    </div>
  </div>

  <!-- MODAL FORMULÁRIO -->
  <div id="modal-form">
    <div class="form-card">

      <div class="form-header">
        <h2 id="form-titulo">Novo evento</h2>
        <button class="btn-fechar-form" onclick="fecharFormulario()">×</button>
      </div>

      <form class="form-body" id="form-evento" onsubmit="return false">

        <div class="f-campo">
          <label>Nome do evento *</label>
          <input type="text" id="f-nome" placeholder="Ex: Show do Thiaguinho" />
        </div>

        <div class="f-campo">
          <label>Local *</label>
          <input type="text" id="f-local" placeholder="Ex: Teatro Amazonas, Centro" />
        </div>

        <div class="form-row">
          <div class="f-campo">
            <label>Emoji do evento</label>
            <input type="text" id="f-emoji" placeholder="🎵" maxlength="4" />
          </div>
          <div class="f-campo">
            <label>Categoria *</label>
            <select id="f-categoria">
              <option value="shows">Shows</option>
              <option value="teatro">Teatro</option>
              <option value="festival">Festivais</option>
              <option value="esporte">Esportes</option>
              <option value="humor">Humor</option>
              <option value="outros">Outros</option>
            </select>
          </div>
        </div>

        <!-- Cor de fundo com exemplos prontos -->
        <div class="f-campo">
          <label>Cor de fundo do card (CSS gradient)</label>
          <input type="text" id="f-cor" placeholder="linear-gradient(135deg, #1a1a2e, #16213e)" />
          <div class="gradientes-hint">
            <span style="font-size:0.72rem;color:var(--cinza-texto)">Clique para usar:</span>
            <div class="gradientes-grid">
              <button type="button" class="grad-btn" style="background:linear-gradient(135deg,#1a1a2e,#16213e)"
                onclick="document.getElementById('f-cor').value='linear-gradient(135deg,#1a1a2e,#16213e)'">Show/Noite</button>
              <button type="button" class="grad-btn" style="background:linear-gradient(135deg,#0a2e1a,#1a4a2a)"
                onclick="document.getElementById('f-cor').value='linear-gradient(135deg,#0a2e1a,#1a4a2a)'">Festival/Verde</button>
              <button type="button" class="grad-btn" style="background:linear-gradient(135deg,#2e0a2a,#4a1a44)"
                onclick="document.getElementById('f-cor').value='linear-gradient(135deg,#2e0a2a,#4a1a44)'">Teatro/Roxo</button>
              <button type="button" class="grad-btn" style="background:linear-gradient(135deg,#00182e,#003060)"
                onclick="document.getElementById('f-cor').value='linear-gradient(135deg,#00182e,#003060)'">Esporte/Azul</button>
              <button type="button" class="grad-btn" style="background:linear-gradient(135deg,#1a1500,#2e2600)"
                onclick="document.getElementById('f-cor').value='linear-gradient(135deg,#1a1500,#2e2600)'">Humor/Dourado</button>
              <button type="button" class="grad-btn" style="background:linear-gradient(135deg,#2e1a00,#4a3000)"
                onclick="document.getElementById('f-cor').value='linear-gradient(135deg,#2e1a00,#4a3000)'">Forró/Laranja</button>
              <button type="button" class="grad-btn" style="background:linear-gradient(135deg,#1a001a,#2e0030)"
                onclick="document.getElementById('f-cor').value='linear-gradient(135deg,#1a001a,#2e0030)'">Pagode/Rosa</button>
              <button type="button" class="grad-btn" style="background:linear-gradient(135deg,#00102e,#001a4a)"
                onclick="document.getElementById('f-cor').value='linear-gradient(135deg,#00102e,#001a4a)'">Pop/Azul Esc.</button>
            </div>
          </div>
        </div>

        <div class="form-row">
          <div class="f-campo">
            <label>Label exibida no card</label>
            <input type="text" id="f-catLabel" placeholder="Ex: Show, Festival..." />
          </div>
          <div class="f-campo">
            <label>Classificação etária</label>
            <input type="text" id="f-class" placeholder="Livre / 10 / 12 / 16 / 18" />
          </div>
        </div>

        <div class="form-row">
          <div class="f-campo" id="vagas-wrap">
            <label>Total de vagas</label>
            <input type="number" id="f-vagas" placeholder="100" min="1" />
          </div>
          <!-- Checkbox evento público -->
          <div class="f-campo" style="justify-content:flex-end;padding-bottom:4px">
            <label style="flex-direction:row;align-items:center;gap:8px;cursor:pointer;text-transform:none;letter-spacing:0;font-size:0.85rem;color:var(--branco)">
              <input type="checkbox" id="f-publico" onchange="togglePublico()"
                style="width:16px;height:16px;accent-color:var(--verde);cursor:pointer" />
              Evento público (vagas ilimitadas)
            </label>
            <small style="color:var(--cinza-texto);font-size:0.72rem;margin-top:4px">Marque para eventos gratuitos e abertos</small>
          </div>
        </div>

        <div class="form-row">
          <div class="f-campo">
            <label>Início *</label>
            <input type="datetime-local" id="f-inicio" />
          </div>
          <div class="f-campo">
            <label>Fim *</label>
            <input type="datetime-local" id="f-fim" />
          </div>
        </div>

        <!-- Tipos de ingresso -->
        <div>
          <div class="opcoes-header">
            <span>Tipos de ingresso * &nbsp;<small style="color:var(--cinza-texto);text-transform:none;letter-spacing:0">(coloque 0 no preço para ingresso gratuito)</small></span>
            <button type="button" class="btn-add-opcao" onclick="novaOpcao()">+ Adicionar tipo</button>
          </div>
          <div id="opcoes-lista"></div>
        </div>

      </form>

      <div class="form-footer">
        <span class="form-msg" id="form-msg"></span>
        <button class="btn-salvar" onclick="salvarEvento()">Salvar evento</button>
      </div>

    </div>
  </div>

  <!-- Firebase SDKs -->
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
  <script src="../js/firebase-config.js"></script>
  <script src="admin.js"></script>
</body>
</html>
